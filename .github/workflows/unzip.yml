name: Unpack project zip

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into the repository
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No zip file found in the repository root."
            exit 1
          fi
          mkdir /tmp/unpacked
          unzip -q "$ZIP" -d /tmp/unpacked
          COUNT=$(ls -A /tmp/unpacked | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "/tmp/unpacked/$(ls -A /tmp/unpacked)" ]; then
            SRC="/tmp/unpacked/$(ls -A /tmp/unpacked)"
          else
            SRC=/tmp/unpacked
          fi
          cp -a "$SRC"/. .
          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files from zip"
          git push
